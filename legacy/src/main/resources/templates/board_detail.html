<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div th:text="${board}"></div>

  <table>
    <tr>
      <th>글번호</th>
      <td th:text="${board.boardNum}"></td>
    </tr>
    <tr>
      <th>제목</th>
      <td th:text="${board.title}"></td>
    </tr>
    <tr>
      <th>작성자</th>
      <td th:text="${board.writer}"></td>
    </tr>
    <tr>
      <th>작성일</th>
      <td th:text="${#temporals.format(board.regDate, 'yyyy-MM-dd HH:mm:ss')}"></td>
    </tr>
    <tr>
      <th>내용</th>
      <td th:text="${board.content}"></td>
    </tr>
  </table>
  <div>
    <button type="button" onclick="location.href='/boards/getList'" style="cursor: pointer">목록</button>

    <button type="button" onclick="location.href='/boards/getList'" style="cursor: pointer">수정</button>

    <form th:action="@{/boards/delete}" method="post">
      <input type="hidden" name="boardNum" th:value="${board.boardNum}">
      <button type="submit" style="cursor: pointer">삭제</button>
    </form>
  </div>
</body>
</html>
