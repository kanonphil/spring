<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="/css/board_detail.css">
</head>
<body>
<!--  <div th:text="${board}"></div>-->
<div class="container">
  <div class="card">
    <h1 class="page-title">상세 페이지</h1>
    <table class="detail-table">
      <tr>
        <th>글번호</th>
        <td th:text="${board.boardNum}"></td>
      </tr>
      <tr>
        <th>제목</th>
        <td th:text="${board.title}"></td>
      </tr>
      <tr>
        <th>작성자</th>
        <td th:text="${board.writer}"></td>
      </tr>
      <tr>
        <th>작성일</th>
        <td th:text="${#temporals.format(board.regDate, 'yyyy-MM-dd HH:mm:ss')}"></td>
      </tr>
      <tr>
        <th>내용</th>
        <td th:text="${board.content}"></td>
      </tr>
    </table>
    <div class="button-group">
      <button type="button" onclick="location.href='/boards/getList'" class="list-btn">목록</button>

      <button
        th:onclick="|location.href='@{/boards/edit(boardNum=${board.boardNum})}'|"
        class="edit-btn">수정</button>

    <!--    <form th:action="@{/boards/delete}" method="post">-->
    <!--      <input type="hidden" name="boardNum" th:value="${board.boardNum}">-->
    <!--      <button type="submit" style="cursor: pointer">삭제</button>-->
    <!--    </form>-->

      <button
        th:onclick="|deleteBoard(${board.boardNum})|"
        class="delete-btn">삭제</button>

    </div>
    <!--    <script>-->
    <!--      function deleteBoard() {-->
    <!--        if (confirm("정말 삭제하시겠습니까?")) {-->
    <!--          const form = document.createElement("form")-->
    <!--          form.method = "post"-->
    <!--          form.action = "/boards/delete"-->

    <!--          const input = document.createElement("input")-->
    <!--          input.type = "hidden"-->
    <!--          input.name = "boardNum"-->
    <!--          input.value = `[[${board.boardNum}]]`-->

    <!--          form.appendChild(input)-->
    <!--          document.body.appendChild(form)-->
    <!--          form.submit()-->
    <!--        }-->
    <!--      }-->
    <!--    </script>-->
  </div>

  <div class="comment-section">
    <form th:action="@{/replies/write}" method="post" class="comment-form">
      <input type="hidden" name="boardNum" th:value="${board.boardNum}">

      <input type="text" name="replyWriter" placeholder="작성자" class="writer-input">
      <textarea name="replyContent" placeholder="댓글" class="content-input"></textarea>

      <button type="submit" class="submit-btn">등록</button>
    </form>
  </div>

  <div class="empty" th:if="${#lists.isEmpty(replyList)}">
    등록된 댓글이 없습니다.
  </div>
  <div class="comment-list" th:unless="${#lists.isEmpty(replyList)}">

    <div class="comment-item" th:each="reply : ${replyList}">

      <div class="comment-top">
        <span class="writer" th:text="${reply.replyWriter}"></span>
        <span class="date"
              th:text="${#temporals.format(reply.regDate, 'yyyy-MM-dd HH:mm:ss')}"></span>
      </div>
      <div class="comment-content"
           th:text="${reply.replyContent}">
      </div>

      <div class="comment-bottom">
        <form th:action="@{/replies/delete}" method="post" class="delete-form">
          <input type="hidden" name="replyNum" th:value="${reply.replyNum}">
          <input type="hidden" name="boardNum" th:value="${board.boardNum}">
          <button type="submit" class="delete-btn">삭제</button>
        </form>
      </div>
    </div>
  </div>
</div>
<script src="/js/board_detail.js"></script>
</body>
</html>
