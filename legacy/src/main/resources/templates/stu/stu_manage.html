<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <link rel="stylesheet" href="/css/stu_manage.css">
</head>
<body>
  <div class="container">
    <div class="left-content">
      <form method="get" action="/students/list">
        <!-- onchange="asyncGetList()" id="classSelector" -->
        <select name="classNum" onchange="this.form.submit()" class="select">
          <option value="0">전체</option>

          <option th:each="cls : ${classList}"
                  th:value="${cls.classNum}"
                  th:text="${cls.className}"
                  th:selected="${cls.classNum == classNum}">
          </option>
        </select>
      </form>

      <!-- id="list_table" -->
      <table class="list-table" id="list_table">
        <thead>
        <tr>
          <th>No</th>
          <th>학번</th>
          <th>이름</th>
          <th>학년</th>
          <th>학급번호</th>
          <th>학급명</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="stu, stat : ${studentList}">
          <td th:text="${#lists.size(studentList) - stat.index}"></td>
          <td th:text="${stu.stuNum}"></td>
          <td>
          <span th:text="${stu.stuName}"
                th:onclick="|getScore(${stu.stuNum})|"
                class="stu-name">
          </span>
          </td>
          <td th:text="${stu.stuYear}"></td>
          <td th:text="${stu.classNum}"></td>
          <td th:text="${stu.classDTO.className}"></td>
        </tr>
        </tbody>

      </table>
    </div>

    <div class="right-content">
      <div id="scoreDiv"></div>
    </div>

  </div>



  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="/js/stu_manage.js"></script>
</body>
</html>
