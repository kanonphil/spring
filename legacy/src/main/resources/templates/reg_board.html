<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="/css/reg_board.css">
</head>
<body>
  <!-- 
    jsp, thymeleaf 사용 시 input 태그의 데이터를 받으려면 form 태그로 input 태그를 감싼다.
    submit 기능을 담당하는 버튼도 form 태그 안에 위치해야 한다.
    form 태그 안의 submit 버튼을 클릭하면 from 태그 안에 포함된 input 태그의 value 값을 action 속성에 작성한 url로 가져감.
    form 태그의 method 속성은 무조건 post로 작성.
  -->

  <div class="container">
    <div class="card">
      <h1 class="page-title">게시글 작성</h1>

      <form th:action="@{/boards/write}" method="post">

        <div class="form-group">
          <label>작성자</label>
          <input type="text" name="writer">
        </div>

        <div class="form-group">
          <label>제목</label>
          <input type="text" name="title">
        </div>

        <div class="form-group">
          <label>내용</label>
          <input type="text" name="content">
        </div>

        <div class="button-group">
          <button type="submit" class="submit-btn">등록</button>
          <button type="button" class="cancel-btn" onclick="history.back()">취소</button>
        </div>
      </form>
    </div>
  </div>

  <!-- <form action="/boards/write2" method="post">
    이름 : <input type="text" name="name"> <br>
    내용 : <input type="text" name="age"> <br>
    
    <button type="submit">등록</button>
  </form> -->
  
</body>
</html>
